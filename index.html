<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>To-Do List Manager</title>
	<style>
		body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
		form { display: flex; gap: 8px; }
		input { flex: 1; padding: 10px; }
		button { padding: 10px 14px; cursor: pointer; }
		ul { list-style: none; padding: 0; }
		li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #ddd; }
		li span { flex: 1; }
		li.completed span { text-decoration: line-through; color: #777; }
		.delete { background: #d33; color: white; border: 0; }
	</style>
</head>
<body>
	<h1>To-Do List</h1>
	<form id="todo-form">
		<input id="task-input" type="text" placeholder="Add a task" required>
		<button type="submit">Add</button>
	</form>
	<ul id="task-list"></ul>

	<script>
		const STORAGE_KEY = 'todoTasks';
		const form = document.getElementById('todo-form');
		const input = document.getElementById('task-input');
		const list = document.getElementById('task-list');
		let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

		function saveTasks() {
			localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
		}

		function renderTasks() {
			list.innerHTML = '';
			tasks.forEach(task => {
				const item = document.createElement('li');
				item.className = task.completed ? 'completed' : '';

				const checkbox = document.createElement('input');
				checkbox.type = 'checkbox';
				checkbox.checked = task.completed;
				checkbox.addEventListener('change', () => {
					task.completed = checkbox.checked;
					saveTasks();
					renderTasks();
				});

				const text = document.createElement('span');
				text.textContent = task.text;

				const deleteButton = document.createElement('button');
				deleteButton.type = 'button';
				deleteButton.className = 'delete';
				deleteButton.textContent = 'Delete';
				deleteButton.addEventListener('click', () => {
					tasks = tasks.filter(currentTask => currentTask.id !== task.id);
					saveTasks();
					renderTasks();
				});

				item.append(checkbox, text, deleteButton);
				list.appendChild(item);
			});
		}

		form.addEventListener('submit', event => {
			event.preventDefault();
			const text = input.value.trim();
			if (!text) return;
			tasks.push({ id: Date.now(), text, completed: false });
			saveTasks();
			renderTasks();
			input.value = '';
			input.focus();
		});

		renderTasks();
	</script>
</body>
</html>
